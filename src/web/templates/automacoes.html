<section class="section" id="sec-automacoes" data-title="Automações">

  <div class="page-header">
    <div class="page-header-icon violet"><span data-icon="bolt"></span></div>
    <div class="page-header-text">
      <h1>Automações</h1>
      <p>Cada automação tem sua própria tela de execução</p>
    </div>
  </div>

  <div id="automacoes-lista">
    <div class="card" style="padding:6px;">
      <div class="automation-list" id="lista-automacoes">
        <!-- preenchido via JS a partir de /web/api/automacoes/lista -->
      </div>
    </div>
  </div>

  <div id="automacoes-execucao" style="display:none;">
    <button class="btn-sm" id="btn-voltar-automacoes" style="margin-bottom:16px;">
      <span data-icon="arrowLeft"></span> Voltar para automações
    </button>

    <div class="tabs">
      <button class="tab-btn active" data-tab="executar">Executar</button>
      <button class="tab-btn" data-tab="historico">Histórico</button>
      <button class="tab-btn" data-tab="config">Configuração</button>
    </div>

    <div class="form-card">
      <div id="campos-automacao">
        <!-- preenchido dinamicamente via JS conforme a automação selecionada -->
      </div>

      <!-- a seleção de pasta abre o diálogo real do Windows via tkinter,
           chamado pelo backend Flask (ver /web/api/sistema/escolher-pasta) -->

      <button class="btn-primary btn-block" id="btn-executar-tarefa">
        <span data-icon="play"></span> Executar tarefa
      </button>
    </div>
  </div>

</section>
